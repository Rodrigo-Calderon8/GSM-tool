<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM-Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
    </style>
</head>
<body x-data="gsmApp()">

    <!-- Login Overlay -->
    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
            <div class="card p-8 w-full max-w-md">
                <h2 class="text-2xl font-bold mb-6 text-center">GSM-Bot Login</h2>
                <input type="password" x-model="password" class="w-full p-3 bg-slate-800 border border-slate-700 rounded mb-4" placeholder="Password">
                <button @click="login()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">Enter Dashboard</button>
                <p x-show="loginError" class="text-red-500 mt-4 text-center" x-text="loginError"></p>
            </div>
        </div>
    </template>

    <div class="min-h-screen flex" x-show="isLoggedIn" x-cloak>
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 border-r border-slate-800 p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-server text-white"></i>
                </div>
                <h1 class="text-xl font-bold">GSM-Bot</h1>
            </div>

            <nav class="space-y-2">
                <button @click="view = 'dashboard'" :class="view === 'dashboard' ? 'bg-blue-600/10 text-blue-500' : 'text-slate-400 hover:bg-slate-800'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                    <i class="fas fa-chart-line w-5"></i> Dashboard
                </button>
                <button @click="view = 'backups'" :class="view === 'backups' ? 'bg-blue-600/10 text-blue-500' : 'text-slate-400 hover:bg-slate-800'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                    <i class="fas fa-history w-5"></i> Backups
                </button>
                <button @click="view = 'settings'" :class="view === 'settings' ? 'bg-blue-600/10 text-blue-500' : 'text-slate-400 hover:bg-slate-800'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                    <i class="fas fa-cog w-5"></i> Settings
                </button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">

            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-3xl font-bold capitalize" x-text="view"></h2>
                    <p class="text-slate-400">Manage your game server instance</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-700 bg-slate-800">
                        <div :class="status === 'running' ? 'bg-green-500' : 'bg-red-500'" class="w-3 h-3 rounded-full animate-pulse"></div>
                        <span class="text-sm font-medium uppercase" x-text="status"></span>
                    </div>
                </div>
            </div>

            <!-- Dashboard View -->
            <div x-show="view === 'dashboard'" class="space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="card p-6 lg:col-span-2">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Server Console</h3>
                            <button @click="fetchLogs()" class="text-xs text-slate-500 hover:text-white"><i class="fas fa-sync"></i> Refresh</button>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-lg font-mono text-sm h-96 overflow-y-auto text-green-400" id="console-logs">
                            <template x-for="line in logs.split('\n')">
                                <div class="mb-1" x-text="line"></div>
                            </template>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="card p-6">
                            <h3 class="font-bold text-lg mb-4">Actions</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <button @click="serverAction('start')" class="bg-green-600 hover:bg-green-700 p-3 rounded font-bold transition flex items-center justify-center gap-2">
                                    <i class="fas fa-play"></i> Start
                                </button>
                                <button @click="serverAction('stop')" class="bg-red-600 hover:bg-red-700 p-3 rounded font-bold transition flex items-center justify-center gap-2">
                                    <i class="fas fa-stop"></i> Stop
                                </button>
                                <button @click="serverAction('restart')" class="bg-yellow-600 hover:bg-yellow-700 p-3 rounded font-bold transition col-span-2 flex items-center justify-center gap-2">
                                    <i class="fas fa-rotate"></i> Restart Server
                                </button>
                            </div>
                        </div>

                        <div class="card p-6">
                            <h3 class="font-bold text-lg mb-4">Backup Overview</h3>
                            <div class="text-center p-4 border border-dashed border-slate-700 rounded-lg">
                                <p class="text-slate-400 text-sm mb-4">Last backup: <span x-text="backups[0]?.date || 'Never'"></span></p>
                                <button @click="confirmBackup()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">
                                    <i class="fas fa-cloud-arrow-up"></i> Backup Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Backups View -->
            <div x-show="view === 'backups'" class="card p-6">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-slate-500 border-b border-slate-800">
                            <th class="pb-4">Filename</th>
                            <th class="pb-4">Size</th>
                            <th class="pb-4">Created At</th>
                            <th class="pb-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="backup in backups">
                            <tr class="border-b border-slate-800/50 hover:bg-slate-800/30 transition">
                                <td class="py-4 font-medium" x-text="backup.filename"></td>
                                <td class="py-4 text-slate-400" x-text="backup.size"></td>
                                <td class="py-4 text-slate-400" x-text="backup.date"></td>
                                <td class="py-4 text-right">
                                    <button @click="confirmRestore(backup.filename)" class="text-blue-500 hover:text-blue-400 font-bold px-3 py-1">Restore</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Settings View -->
            <div x-show="view === 'settings'" class="space-y-6">
                <div class="card p-6">
                    <h3 class="font-bold text-lg mb-4">Infrastructure Settings (.env)</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <template x-for="(val, key) in settings.env">
                            <div class="space-y-1">
                                <label class="text-xs text-slate-500 uppercase" x-text="key"></label>
                                <input type="text" x-model="settings.env[key]" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm">
                            </div>
                        </template>
                    </div>
                </div>
                <div class="card p-6">
                    <h3 class="font-bold text-lg mb-4">Game Settings (game.env)</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <template x-for="(val, key) in settings.game_env">
                            <div class="space-y-1">
                                <label class="text-xs text-slate-500 uppercase" x-text="key"></label>
                                <input type="text" x-model="settings.game_env[key]" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm">
                            </div>
                        </template>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button @click="saveSettings()" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded font-bold transition">Save Configuration</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Modals -->
    <div x-show="modal.show" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm" x-cloak>
        <div class="card p-8 max-w-sm w-full">
            <h4 class="text-xl font-bold mb-4" x-text="modal.title"></h4>
            <p class="text-slate-400 mb-6" x-text="modal.message"></p>
            <div class="flex gap-4">
                <button @click="modal.show = false" class="flex-1 bg-slate-700 p-3 rounded font-bold">Cancel</button>
                <button @click="modal.action()" class="flex-1 bg-blue-600 p-3 rounded font-bold">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        function gsmApp() {
            return {
                view: 'dashboard',
                isLoggedIn: false,
                password: '',
                loginError: '',
                status: 'offline',
                logs: 'Fetching logs...',
                backups: [],
                settings: { env: {}, game_env: {} },
                modal: { show: false, title: '', message: '', action: null },

                async init() {
                    // In a real app we'd check session, here we just check if password is set in env
                    // For now, let's just allow access if they enter 'admin' or if password is not set
                    this.fetchStatus();
                    this.fetchLogs();
                    this.fetchBackups();
                    this.fetchSettings();

                    setInterval(() => {
                        if(this.isLoggedIn && this.view === 'dashboard') {
                            this.fetchStatus();
                            this.fetchLogs();
                        }
                    }, 5000);
                },

                login() {
                    // Simplified login logic
                    if (this.password === 'admin' || this.password === '') {
                        this.isLoggedIn = true;
                    } else {
                        this.loginError = 'Invalid password';
                    }
                },

                async fetchStatus() {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    this.status = data.status;
                },

                async fetchLogs() {
                    const res = await fetch('/api/logs');
                    const data = await res.json();
                    this.logs = data.logs;
                },

                async fetchBackups() {
                    const res = await fetch('/api/backups');
                    this.backups = await res.json();
                },

                async fetchSettings() {
                    const res = await fetch('/api/settings');
                    this.settings = await res.json();
                },

                async serverAction(action) {
                    await fetch(`/api/server/${action}`, { method: 'POST' });
                    setTimeout(() => this.fetchStatus(), 1000);
                },

                confirmBackup() {
                    this.modal = {
                        show: true,
                        title: 'Confirm Backup',
                        message: 'Are you sure you want to trigger a manual backup now?',
                        action: async () => {
                            this.modal.show = false;
                            await fetch('/api/backup/now', { method: 'POST' });
                            this.fetchBackups();
                        }
                    };
                },

                confirmRestore(filename) {
                    this.modal = {
                        show: true,
                        title: 'Confirm Restore',
                        message: `Are you sure you want to restore ${filename}? This will overwrite current game data and requires a restart.`,
                        action: async () => {
                            this.modal.show = false;
                            // Add restore API call here
                            alert('Restoration initiated. Please wait and then restart the server.');
                        }
                    };
                },

                async saveSettings() {
                    await fetch('/api/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.settings)
                    });
                    alert('Settings saved!');
                }
            }
        }
    </script>
</body>
</html>
