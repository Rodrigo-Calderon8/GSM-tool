services:
  game-server:
    image: ${GAME_IMAGE}
    container_name: gsm-game-server
    restart: unless-stopped
    ports:
      - "${GAME_PORT_1}"
      - "${GAME_PORT_2}"
    env_file:
      - game.env
    volumes:
      - ./game-data:${GAME_INTERNAL_DATA_PATH}

  backup-manager:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: gsm-backup-manager
    restart: unless-stopped
    depends_on:
      - game-server
    volumes:
      - ./game-data:/game-data
      - ./backups:/backups
      - ./scripts:/scripts
      - ~/.config/rclone:/root/.config/rclone
    environment:
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-5}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-3}
      - RCLONE_REMOTE_NAME=${RCLONE_REMOTE_NAME:-gdrive}
      - ENABLE_CLOUD_BACKUP=${ENABLE_CLOUD_BACKUP:-false}
